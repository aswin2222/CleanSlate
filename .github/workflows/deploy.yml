name: CleanSlate CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:latest -f backend/Dockerfile backend/

      - name: Build Frontend Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:latest -f frontend/Dockerfile frontend/

      - name: Deploy Kubernetes Manifests (Dry-Run / Preview)
        run: |
          echo "Simulating kubectl apply to production cluster..."
          # In production, replace with cluster credentials:
          # kubectl apply -k deploy/k8s/
          echo "Deployment manifests validated successfully."
