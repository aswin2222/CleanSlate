name: CleanSlate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov hypothesis ruff mypy pip-audit

      - name: Security Vulnerability Scan (pip-audit)
        run: |
          pip-audit || echo "Security audit completed with non-blocking warnings"

      - name: Code Quality & Linting
        run: |
          ruff check backend/
          mypy backend/app/ || echo "Type checking report generated"

      - name: Run Test Suite with Coverage Gate
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=xml --cov-fail-under=80

      - name: Run Adversarial Robustness Check
        run: |
          python scripts/generate_adversarial_corpus.py
          pytest backend/tests/adversarial -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Frontend Audit & Typecheck
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || echo "Frontend audit completed"
          npm run build

  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t cleanslate-backend:latest -f backend/Dockerfile backend/
          docker build -t cleanslate-frontend:latest -f frontend/Dockerfile frontend/
