services:
  - type: web
    name: titan-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "bash start.sh"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://titancoho.netlify.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: DATA_ENCRYPTION_KEY
        value: dGhpcy1pcy1hLTMyLWJ5dGUtZGV2LWtleS0xMjM0NTY3ODk=
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
