apiVersion: v1
kind: Service
metadata:
  name: cleanslate-backend-service
  namespace: cleanslate
  labels:
    app: cleanslate-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: cleanslate-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cleanslate-backend-hpa
  namespace: cleanslate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cleanslate-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
