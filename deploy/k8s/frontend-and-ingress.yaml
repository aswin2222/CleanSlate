apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanslate-frontend
  namespace: cleanslate
  labels:
    app: cleanslate-frontend
    tier: ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cleanslate-frontend
  template:
    metadata:
      labels:
        app: cleanslate-frontend
        tier: ui
    spec:
      containers:
        - name: frontend
          image: cleanslate-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cleanslate-frontend-service
  namespace: cleanslate
  labels:
    app: cleanslate-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: cleanslate-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cleanslate-ingress
  namespace: cleanslate
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - cleanslate.enterprise.internal
      secretName: cleanslate-tls-cert
  rules:
    - host: cleanslate.enterprise.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cleanslate-backend-service
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cleanslate-backend-service
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: cleanslate-backend-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: cleanslate-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cleanslate-frontend-service
                port:
                  number: 80
